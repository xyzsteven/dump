root@wazuhserver:/var/ossec/etc# cat shared/test2/agent.conf
<agent_config>

  <!-- Disable Security Configuration Assessment (SCA) -->
  <sca>
    <enabled>no</enabled>
  </sca>

  <!-- Monitor disk space usage -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <!-- Monitor open ports for new or closed listening ports -->
  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>60</frequency>
  </localfile>

  <!-- Monitor last 20 logins -->
  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>360</frequency>
  </localfile>

  <!-- Collect system logs from journald -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <!-- Monitor Wazuh active response actions -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- Monitor installed/updated packages -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

</agent_config>

<agent_config name="targetserver2-agent">

  <!-- Monitor running Docker containers status -->
  <localfile>
    <log_format>full_command</log_format>
    <command>/usr/bin/docker ps --format "{{.Names}} {{.Image}} {{.Ports}}"</command>
    <alias>docker running containers</alias>
    <frequency>60</frequency>
  </localfile>

  <!-- Monitor Apache2 access and error logs -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>

</agent_config>
